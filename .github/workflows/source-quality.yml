name: Source quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/quality/requirements.txt
      - name: Test scanner and review policy
        run: python -m unittest discover -s tools/quality -p 'test_*.py' -v
      - name: Generate inventory and enforce review decisions
        if: ${{ !cancelled() }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="$PUSH_BASE"
          if [ -n "$PR_BASE" ]; then
            base="$(git merge-base HEAD "$PR_BASE")"
          fi
          python tools/quality/check.py --base "$base"
      - name: Publish revision-linked report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-quality-${{ github.event.pull_request.head.sha || github.sha }}
          path: quality-report/
          if-no-files-found: error
          retention-days: 30
